# Vollbild-Beispiel für die über HACS installierte Lovelace-Ressource.
# Füge diese Datei in ein YAML-Dashboard ein oder kopiere nur die Kartenkonfiguration in eine manuelle Karte.
title: Neo Zuhause
# Benötigt die HACS-Erweiterung "Kiosk Mode", wenn Header und Sidebar ausgeblendet werden sollen.
kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - title: Neo Dashboard
    path: neo-dashboard
    panel: true
    cards:
      - type: custom:ha-neo-dashboard
        title: WOHNZIMMER
        subtitle: Erdgeschoss
        background_image: /local/neo-dashboard/background.jpg
        image: /local/neo-dashboard/living-room.png
        default_page: overview
        scene_label: SZENE
        scene_entity: scene.living_room_evening
        temperature_entity: sensor.living_room_temperature
        humidity_entity: sensor.living_room_humidity
        all_lights_entity: light.living_room_all
        top_tabs:
          - label: SYSTEM
            tap_action:
              action: none
          - label: WARTUNG
            tap_action:
              action: navigate
              navigation_path: /lovelace/maintenance
        systems:
          - icon: mdi:shield-check
            name: ALARM
            entity: alarm_control_panel.home_alarm
            label: Nicht scharf
            color: muted
            tap_action:
              action: more-info
              entity: alarm_control_panel.home_alarm
          - icon: mdi:cctv
            name: KAMERAS
            entity: camera.front_door
            label: Aufzeichnung
            color: muted
            tap_action:
              action: more-info
              entity: camera.front_door
          - icon: mdi:cloud-alert
            name: BACKUPS
            entity: sensor.backup_state
            label: Cloud-Backup veraltet
            color: orange
            tap_action:
              action: more-info
              entity: sensor.backup_state
          - icon: mdi:battery-high
            name: USV
            entity: sensor.ups_battery
            label: 100% / 94m
            color: muted
            tap_action:
              action: more-info
              entity: sensor.ups_battery
        metrics:
          - name: CPU_Centauri (avg. 24h)
            entity: sensor.centauri_cpu
            max: 100
            tap_action:
              action: more-info
              entity: sensor.centauri_cpu
          - name: 'Speicher: Ganymede'
            entity: sensor.ganymede_storage
            max: 100
            tap_action:
              action: more-info
              entity: sensor.ganymede_storage
          - name: 'Speicher: Metis'
            entity: sensor.metis_storage
            max: 100
            tap_action:
              action: more-info
              entity: sensor.metis_storage
          - name: Starman
            entity: sensor.starman_speed
            max: 5000
            unit: km/h
            tap_action:
              action: more-info
              entity: sensor.starman_speed
        gauges:
          - name: TEMP
            icon: mdi:thermometer
            entity: sensor.living_room_temperature
            unit: °C
            max: 30
            color: '#aeb5e9'
            label_mode: temperature_comfort
            tap_action:
              action: more-info
              entity: sensor.living_room_temperature
          - name: FEUCHTE
            icon: mdi:water-percent
            entity: sensor.living_room_humidity
            unit: '%'
            max: 100
            color: '#f29a37'
            label: Trocken
            tap_action:
              action: more-info
              entity: sensor.living_room_humidity
          - name: HEIZUNG
            icon: mdi:radiator
            entity: climate.living_room
            value_entity: sensor.living_room_target_temperature
            unit: °C
            max: 30
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: climate-temperature-step
                  entity: climate.living_room
                  step: -0.5
              - label_mode: climate_power
                tap_action:
                  action: climate-toggle-heat
                  entity: climate.living_room
              - label: '+'
                tap_action:
                  action: climate-temperature-step
                  entity: climate.living_room
                  step: 0.5
            tap_action:
              action: more-info
              entity: climate.living_room
          - name: ALLE LICHTER
            icon: mdi:lightbulb-group
            entity: light.living_room_all
            value_entity: sensor.living_room_light_level
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.living_room_all
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.living_room_all
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.living_room_all
                  step: 20
            tap_action:
              action: toggle
              entity: light.living_room_all
          - name: STEHLAMPE
            icon: mdi:floor-lamp
            entity: light.floor_lamp
            value_entity: sensor.floor_lamp_brightness
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.floor_lamp
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.floor_lamp
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.floor_lamp
                  step: 20
            tap_action:
              action: toggle
              entity: light.floor_lamp
          - name: DECKENSPOTS
            icon: mdi:ceiling-light-multiple
            entity: light.ceiling_spots
            value_entity: sensor.ceiling_spots_brightness
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.ceiling_spots
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.ceiling_spots
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.ceiling_spots
                  step: 20
            tap_action:
              action: toggle
              entity: light.ceiling_spots
        pages:
          - id: overview
            label: Übersicht
            title: WOHNZIMMER
            subtitle: Erdgeschoss
            icon: mdi:rocket-launch
            type: overview
          - id: climate
            label: Klima
            title: KLIMA
            subtitle: 7 Tage Verlauf und Heizung
            icon: mdi:heat-wave
            tiles:
              - name: Heizung
                entity: climate.living_room
                icon: mdi:radiator
                tap_action:
                  action: more-info
                  entity: climate.living_room
          - id: lights
            label: Lichter
            title: LICHTER
            subtitle: Alle Leuchten im Raum
            icon: mdi:lightbulb-on-outline
            tiles:
              - name: Alle Lichter
                entity: light.living_room_all
                icon: mdi:lightbulb-group
                tap_action:
                  action: toggle
                  entity: light.living_room_all
              - name: Stehlampe
                entity: light.floor_lamp
                icon: mdi:floor-lamp
                tap_action:
                  action: toggle
                  entity: light.floor_lamp
              - name: Deckenspots
                entity: light.ceiling_spots
                icon: mdi:ceiling-light-multiple
                tap_action:
                  action: toggle
                  entity: light.ceiling_spots
              - name: Akzentlicht
                entity: light.living_room_accent
                icon: mdi:led-strip-variant
                tap_action:
                  action: toggle
                  entity: light.living_room_accent
          - id: security
            label: Sicherheit
            title: SICHERHEIT
            subtitle: Kamerafeed, Tür und Fenster
            icon: mdi:shield-home-outline
            tiles:
              - name: Kamerafeed
                entity: camera.front_door
                icon: mdi:cctv
                tap_action:
                  action: more-info
                  entity: camera.front_door
              - name: Türsensor
                entity: binary_sensor.living_room_door
                icon: mdi:door
                tap_action:
                  action: more-info
                  entity: binary_sensor.living_room_door
              - name: Fenstersensor
                entity: binary_sensor.living_room_window
                icon: mdi:window-closed-variant
                tap_action:
                  action: more-info
                  entity: binary_sensor.living_room_window
              - name: Alarm
                entity: alarm_control_panel.home_alarm
                icon: mdi:shield-lock
                tap_action:
                  action: more-info
                  entity: alarm_control_panel.home_alarm
          - id: media
            label: Medien
            title: MEDIEN
            subtitle: Xbox, PlayStation und Apple TV
            icon: mdi:play-box-outline
            tiles:
              - name: Xbox
                entity: media_player.living_room_xbox
                icon: mdi:microsoft-xbox
                tap_action:
                  action: toggle
                  entity: media_player.living_room_xbox
              - name: PlayStation
                entity: media_player.living_room_playstation
                icon: mdi:sony-playstation
                tap_action:
                  action: toggle
                  entity: media_player.living_room_playstation
              - name: Apple TV
                entity: media_player.living_room_apple_tv
                icon: mdi:apple
                tap_action:
                  action: toggle
                  entity: media_player.living_room_apple_tv
              - name: Play/Pause
                icon: mdi:play-pause
                label: Apple TV
                tap_action:
                  action: call-service
                  service: media_player.media_play_pause
                  target:
                    entity_id: media_player.living_room_apple_tv
          - id: maintenance
            label: Wartung
            title: WARTUNG
            subtitle: Systemzustand
            icon: mdi:router-wireless-settings
            tiles:
              - name: Backups
                entity: sensor.backup_state
                icon: mdi:cloud-upload
                tap_action:
                  action: more-info
                  entity: sensor.backup_state
              - name: CPU
                entity: sensor.centauri_cpu
                icon: mdi:cpu-64-bit
                tap_action:
                  action: more-info
                  entity: sensor.centauri_cpu
              - name: Speicher
                entity: sensor.ganymede_storage
                icon: mdi:harddisk
                tap_action:
                  action: more-info
                  entity: sensor.ganymede_storage
              - name: HA neu starten
                icon: mdi:restart
                label: Dienstaufruf
                tap_action:
                  action: call-service
                  service: homeassistant.restart
          - id: presence
            label: Anwesenheit
            title: ANWESENHEIT
            subtitle: Personen und Automationen
            icon: mdi:map-marker-radius-outline
            tiles:
              - name: Person 1
                entity: person.person_1
                icon: mdi:account
                tap_action:
                  action: more-info
                  entity: person.person_1
              - name: Person 2
                entity: person.person_2
                icon: mdi:account-outline
                tap_action:
                  action: more-info
                  entity: person.person_2
              - name: Gastmodus
                entity: input_boolean.guest_mode
                icon: mdi:account-plus
                tap_action:
                  action: toggle
                  entity: input_boolean.guest_mode
              - name: Abwesenheitsmodus
                entity: input_boolean.away_mode
                icon: mdi:home-export-outline
                tap_action:
                  action: toggle
                  entity: input_boolean.away_mode
          - id: systems
            label: System
            title: SYSTEM
            subtitle: Infrastruktur
            icon: mdi:database-cog-outline
            tiles:
              - name: USV
                entity: sensor.ups_battery
                icon: mdi:battery-high
                tap_action:
                  action: more-info
                  entity: sensor.ups_battery
              - name: Router
                entity: binary_sensor.router_status
                icon: mdi:router-network
                tap_action:
                  action: more-info
                  entity: binary_sensor.router_status
              - name: Server
                entity: sensor.server_status
                icon: mdi:server
                tap_action:
                  action: more-info
                  entity: sensor.server_status
              - name: Protokolle
                icon: mdi:text-box-search
                label: Navigation
                tap_action:
                  action: navigate
                  navigation_path: /config/logs
