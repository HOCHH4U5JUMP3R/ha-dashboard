# Vollbild-Beispiel für die über HACS installierte Lovelace-Ressource.
# Füge diese Datei in ein YAML-Dashboard ein oder kopiere nur die Kartenkonfiguration in eine manuelle Karte.
title: Neo Zuhause
# Benötigt die HACS-Erweiterung "Kiosk Mode", wenn Header und Sidebar ausgeblendet werden sollen.
kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - title: Neo Dashboard
    path: neo-dashboard
    panel: true
    cards:
      - type: custom:ha-neo-dashboard
        title: WOHNZIMMER
        subtitle: Erdgeschoss
        background_image: /local/neo-dashboard/background.jpg
        image: /local/neo-dashboard/living-room.png
        default_room: living_room
        default_page: home
        rooms:
          - id: bedroom
            title: SCHLAFZIMMER
            subtitle: Ruhen
            icon: mdi:bed-king-outline
            image: /local/neo-dashboard/bedroom.png
            background_image: /local/neo-dashboard/bedroom-background.jpg
            scene_entity: scene.bedroom_evening
            temperature_entity: sensor.bedroom_temperature
            humidity_entity: sensor.bedroom_humidity
            all_lights_entity: light.bedroom_all
          - id: living_room
            title: WOHNZIMMER
            subtitle: Erdgeschoss
            icon: mdi:sofa-outline
            image: /local/neo-dashboard/living-room.png
            background_image: /local/neo-dashboard/living_room-background.jpg
            scene_entity: scene.living_room_evening
            temperature_entity: sensor.living_room_temperature
            humidity_entity: sensor.living_room_humidity
            all_lights_entity: light.living_room_all
            socket_entities:
              - name: TV
                entity: switch.living_room_tv
              - name: Konsole
                entity: switch.living_room_console
            contact_entities:
              - name: Terrassentür
                entity: binary_sensor.living_room_patio_door
              - name: Fenster
                entity: binary_sensor.living_room_window
          - id: office
            title: BÜRO
            subtitle: Arbeiten
            icon: mdi:desk
            image: /local/neo-dashboard/office.png
            background_image: /local/neo-dashboard/office-background.jpg
            scene_entity: scene.office_evening
            temperature_entity: sensor.office_temperature
            humidity_entity: sensor.office_humidity
            all_lights_entity: light.office_all
            enabled_pages: [home, overview, climate, lights, power, security, system, server]
            socket_entities:
              - name: Drucker
                entity: switch.office_printer
              - name: Dock
                entity: switch.office_dock
            contact_entities:
              - name: Fenster
                entity: binary_sensor.office_window
              - name: Tür
                entity: binary_sensor.office_door
          - id: kitchen
            title: KÜCHE
            subtitle: Kochen
            icon: mdi:silverware-fork-knife
            image: /local/neo-dashboard/kitchen.png
            background_image: /local/neo-dashboard/kitchen-background.jpg
            scene_entity: scene.kitchen_evening
            temperature_entity: sensor.kitchen_temperature
            humidity_entity: sensor.kitchen_humidity
            all_lights_entity: light.kitchen_all
          - id: bathroom
            title: BADEZIMMER
            subtitle: Wellness
            icon: mdi:shower-head
            image: /local/neo-dashboard/bathroom.png
            background_image: /local/neo-dashboard/bathroom-background.jpg
            scene_entity: scene.bathroom_evening
            temperature_entity: sensor.bathroom_temperature
            humidity_entity: sensor.bathroom_humidity
            all_lights_entity: light.bathroom_all
          - id: garage
            title: GARAGE
            subtitle: Tor und Fahrzeuge
            icon: mdi:garage-variant
            image: /local/neo-dashboard/garage.png
            background_image: /local/neo-dashboard/garage-background.jpg
            scene_entity: scene.garage_work
            temperature_entity: sensor.garage_temperature
            humidity_entity: sensor.garage_humidity
            all_lights_entity: light.garage_all
          - id: basement
            title: KELLER
            subtitle: Technik und Vorrat
            icon: mdi:stairs-down
            image: /local/neo-dashboard/basement.png
            background_image: /local/neo-dashboard/basement-background.jpg
            scene_entity: scene.basement_work
            temperature_entity: sensor.basement_temperature
            humidity_entity: sensor.basement_humidity
            all_lights_entity: light.basement_all
        home_title: STARTSEITE
        home_subtitle: Wohnung
        presence:
          - name: Person 1
            entity: person.person_1
            icon: mdi:account
          - name: Person 2
            entity: person.person_2
            icon: mdi:account-outline
        # Optional: eigenes PNG/SVG unter /config/www/neo-dashboard/ ablegen.
        apartment_floorplan_image: /local/community/ha-dashboard-assets/home.svg
        floorplan_rooms:
          - label: Büro
            room: office
            x: 24
            y: 30
            width: 25
            height: 34
          - label: Küche
            room: kitchen
            x: 48
            y: 30
            width: 20
            height: 34
          - label: Wohnzimmer
            room: living_room
            x: 72
            y: 34
            width: 30
            height: 42
          - label: Badezimmer
            room: bathroom
            x: 35
            y: 75
            width: 20
            height: 26
          - label: Schlafzimmer
            room: bedroom
            x: 70
            y: 73
            width: 30
            height: 34
        floorplan_entities:
          - name: Wohnzimmer Licht
            entity: light.living_room_all
            icon: mdi:lightbulb-group
            x: 72
            y: 36
            tap_action:
              action: toggle
              entity: light.living_room_all
          - name: Küche Temperatur
            entity: sensor.kitchen_temperature
            icon: mdi:thermometer
            x: 48
            y: 28
          - name: Büro Bewegung
            entity: binary_sensor.office_motion
            icon: mdi:motion-sensor
            x: 24
            y: 30
        scene_label: SZENE
        scene_entity: scene.living_room_evening
        temperature_entity: sensor.living_room_temperature
        humidity_entity: sensor.living_room_humidity
        all_lights_entity: light.living_room_all
        top_tabs:
          - label: SYSTEM
            tap_action:
              action: none
          - label: WARTUNG
            tap_action:
              action: navigate
              navigation_path: /lovelace/maintenance
        systems:
          - icon: mdi:shield-check
            name: ALARM
            entity: alarm_control_panel.home_alarm
            label: Nicht scharf
            color: muted
            tap_action:
              action: more-info
              entity: alarm_control_panel.home_alarm
          - icon: mdi:cctv
            name: KAMERAS
            entity: camera.{prefix}
            label: Aufzeichnung
            color: muted
            tap_action:
              action: more-info
              entity: camera.{prefix}
          - icon: mdi:cloud-alert
            name: BACKUPS
            entity: sensor.backup_state
            label: Cloud-Backup veraltet
            color: orange
            tap_action:
              action: more-info
              entity: sensor.backup_state
          - icon: mdi:battery-high
            name: USV
            entity: sensor.ups_battery
            label: 100% / 94m
            color: muted
            tap_action:
              action: more-info
              entity: sensor.ups_battery
        metrics:
          - name: CPU_Centauri (avg. 24h)
            entity: sensor.centauri_cpu
            max: 100
            tap_action:
              action: more-info
              entity: sensor.centauri_cpu
          - name: 'Speicher: Ganymede'
            entity: sensor.ganymede_storage
            max: 100
            tap_action:
              action: more-info
              entity: sensor.ganymede_storage
          - name: 'Speicher: Metis'
            entity: sensor.metis_storage
            max: 100
            tap_action:
              action: more-info
              entity: sensor.metis_storage
          - name: Starman
            entity: sensor.starman_speed
            max: 5000
            unit: km/h
            tap_action:
              action: more-info
              entity: sensor.starman_speed
        gauges:
          - name: TEMP
            icon: mdi:thermometer
            entity: sensor.{prefix}_temperature
            unit: °C
            max: 30
            color: '#aeb5e9'
            label_mode: temperature_comfort
            tap_action:
              action: more-info
              entity: sensor.{prefix}_temperature
          - name: FEUCHTE
            icon: mdi:water-percent
            entity: sensor.{prefix}_humidity
            unit: '%'
            max: 100
            color: '#f29a37'
            label: Trocken
            tap_action:
              action: more-info
              entity: sensor.{prefix}_humidity
          - name: HEIZUNG
            icon: mdi:radiator
            entity: climate.{prefix}
            value_attribute: temperature
            unit: °C
            max: 30
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: climate-temperature-step
                  entity: climate.{prefix}
                  step: -0.5
              - label_mode: climate_power
                tap_action:
                  action: climate-toggle-heat
                  entity: climate.{prefix}
              - label: '+'
                tap_action:
                  action: climate-temperature-step
                  entity: climate.{prefix}
                  step: 0.5
            tap_action:
              action: more-info
              entity: climate.{prefix}
          - name: ALLE LICHTER
            icon: mdi:lightbulb-group
            entity: light.{prefix}_all
            value_entity: sensor.{prefix}_light_level
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_all
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.{prefix}_all
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_all
                  step: 20
            tap_action:
              action: toggle
              entity: light.{prefix}_all
          - name: STEHLAMPE
            icon: mdi:floor-lamp
            entity: light.{prefix}_main
            value_entity: sensor.{prefix}_main_light_level
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_main
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.{prefix}_main
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_main
                  step: 20
            tap_action:
              action: toggle
              entity: light.{prefix}_main
          - name: DECKENSPOTS
            icon: mdi:ceiling-light-multiple
            entity: light.{prefix}_ceiling
            value_entity: sensor.{prefix}_ceiling_light_level
            unit: '%'
            max: 100
            color: '#2c9cff'
            controls:
              - label: '-'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_ceiling
                  step: -20
              - label_mode: power
                tap_action:
                  action: toggle
                  entity: light.{prefix}_ceiling
              - label: '+'
                tap_action:
                  action: light-brightness-step
                  entity: light.{prefix}_ceiling
                  step: 20
            tap_action:
              action: toggle
              entity: light.{prefix}_ceiling
        pages:
          - id: home
            label: Startseite
            title: STARTSEITE
            subtitle: Wohnung
            icon: mdi:home-outline
            type: home
          - id: overview
            label: Übersicht
            title: WOHNZIMMER
            subtitle: Erdgeschoss
            icon: mdi:rocket-launch
            type: overview
          - id: climate
            label: Klima
            title: KLIMA
            subtitle: 7 Tage Verlauf und Heizung
            icon: mdi:heat-wave
            tiles:
              - name: Heizung
                entity: climate.{prefix}
                icon: mdi:radiator
                tap_action:
                  action: more-info
                  entity: climate.{prefix}
          - id: lights
            label: Lichter
            title: LICHTER
            subtitle: Alle Leuchten im Raum
            icon: mdi:lightbulb-on-outline
            tiles:
              - name: Alle Lichter
                entity: light.{prefix}_all
                icon: mdi:lightbulb-group
                tap_action:
                  action: toggle
                  entity: light.{prefix}_all
              - name: Hauptlicht
                entity: light.{prefix}_main
                icon: mdi:ceiling-light-multiple
                tap_action:
                  action: toggle
                  entity: light.{prefix}_main
              - name: Schreibtischlicht
                entity: light.{prefix}_desk
                icon: mdi:desk-lamp
                tap_action:
                  action: toggle
                  entity: light.{prefix}_desk
              - name: Akzentlicht
                entity: light.{prefix}_accent
                icon: mdi:led-strip-variant
                tap_action:
                  action: toggle
                  entity: light.{prefix}_accent
          - id: power
            label: Strom
            title: STROM
            subtitle: Verbrauch und Steckdosen
            icon: mdi:flash-outline
            tiles:
              - name: Raumverbrauch
                entity: sensor.{prefix}_power
                icon: mdi:flash
                tap_action:
                  action: more-info
                  entity: sensor.{prefix}_power
              - name: Tagesverbrauch
                entity: sensor.{prefix}_energy_today
                icon: mdi:chart-bar
                tap_action:
                  action: more-info
                  entity: sensor.{prefix}_energy_today
              - name: Steckdose 1
                entity: switch.{prefix}_socket_1
                icon: mdi:power-socket-de
                tap_action:
                  action: toggle
                  entity: switch.{prefix}_socket_1
              - name: Steckdose 2
                entity: switch.{prefix}_socket_2
                icon: mdi:power-socket-de
                tap_action:
                  action: toggle
                  entity: switch.{prefix}_socket_2
          - id: security
            label: Sicherheit
            title: SICHERHEIT
            subtitle: Kamerafeed, Tür und Fenster
            icon: mdi:shield-home-outline
            tiles:
              - name: Kamerafeed
                entity: camera.{prefix}
                icon: mdi:cctv
                tap_action:
                  action: more-info
                  entity: camera.{prefix}
              - name: Türsensor
                entity: binary_sensor.{prefix}_door
                icon: mdi:door
                tap_action:
                  action: more-info
                  entity: binary_sensor.{prefix}_door
              - name: Fenstersensor
                entity: binary_sensor.{prefix}_window
                icon: mdi:window-closed-variant
                tap_action:
                  action: more-info
                  entity: binary_sensor.{prefix}_window
              - name: Alarm
                entity: alarm_control_panel.home_alarm
                icon: mdi:shield-lock
                tap_action:
                  action: more-info
                  entity: alarm_control_panel.home_alarm
          - id: system
            label: System
            title: SYSTEM
            subtitle: Home Assistant und Dienste
            icon: mdi:cog-outline
            tiles:
              - name: Backups
                entity: sensor.backup_state
                icon: mdi:cloud-upload
                tap_action:
                  action: more-info
                  entity: sensor.backup_state
              - name: CPU
                entity: sensor.centauri_cpu
                icon: mdi:cpu-64-bit
                tap_action:
                  action: more-info
                  entity: sensor.centauri_cpu
              - name: Speicher
                entity: sensor.ganymede_storage
                icon: mdi:harddisk
                tap_action:
                  action: more-info
                  entity: sensor.ganymede_storage
              - name: HA neu starten
                icon: mdi:restart
                label: Dienstaufruf
                tap_action:
                  action: call-service
                  service: homeassistant.restart
          - id: server
            label: Server
            title: SERVER
            subtitle: MediaCenter22, Fritz!Box und Dienste
            icon: mdi:server-network
            rooms: [office]
            server:
              name: MediaCenter22
              icon: mdi:nas
              entity: binary_sensor.192_168_178_22
              tap_action:
                action: more-info
                entity: binary_sensor.192_168_178_22
            server_status_sections:
              - heading: CPU
                icon: mdi:nas
                badges:
                  - entity: sensor.192_168_178_22_cpu_auslastung
                    icon: phu:intel-cpu
                    ok_below: 50
                    warning_above: 50
                    name: CPU Auslastung
                  - entity: sensor.192_168_178_22_k10temp_0_temperatur
                    icon: mdi:thermometer
                    ok_below: 75
                    critical_above: 74
                    name: CPU Temperatur
              - heading: Lüfter
                icon: mdi:fan
                badges:
                  - entity: sensor.mediacenter22_fan_1
                    icon: mdi:fan
                    color: blue
                    name: Lüfter 1
                  - entity: sensor.mediacenter22_fan_2
                    icon: mdi:fan
                    color: blue
                    name: Lüfter 2
              - heading: Netzwerk
                icon: mdi:network
                badges:
                  - entity: sensor.mediacenter22_network_download
                    icon: mdi:download-network
                    color: blue
                    name: Download
                  - entity: sensor.mediacenter22_network_upload
                    icon: mdi:upload-network
                    color: blue
                    name: Upload
              - heading: RAM
                icon: mdi:memory
                badges:
                  - entity: sensor.mediacenter22_ram_usage
                    icon: mdi:memory
                    ok_below: 50
                    warning_above: 50
                    name: RAM Nutzung
                  - entity: sensor.mediacenter22_ram_free
                    icon: mdi:database
                    color: green
                    name: RAM Frei
              - heading: Speicher
                icon: mdi:harddisk
                badges:
                  - entity: sensor.mediacenter22_storage_usage
                    icon: mdi:harddisk
                    ok_below: 70
                    warning_above: 70
                    name: Speicher Nutzung
                  - entity: sensor.mediacenter22_storage_free
                    icon: mdi:database-outline
                    color: yellow
                    name: Speicher Frei
              - heading: Festplatten
                icon: mdi:harddisk
                badges:
                  - entity: sensor.mediacenter22_disk_1_temperature
                    icon: mdi:harddisk
                    ok_below: 45
                    warning_above: 45
                    name: Disk 1
                  - entity: sensor.mediacenter22_disk_2_temperature
                    icon: mdi:harddisk
                    ok_below: 45
                    warning_above: 45
                    name: Disk 2
                  - entity: sensor.mediacenter22_disk_3_temperature
                    icon: mdi:harddisk
                    ok_below: 45
                    warning_above: 45
                    name: Disk 3
                  - entity: sensor.mediacenter22_disk_4_temperature
                    icon: mdi:harddisk
                    ok_below: 45
                    warning_above: 45
                    name: Disk 4
            tiles:
              - name: MediaCenter22
                entity: sensor.mediacenter22_status
                icon: mdi:power
                span: 2
                tap_action:
                  action: more-info
                  entity: sensor.mediacenter22_status
              - name: Download
                entity: sensor.fritzbox_download_speed
                icon: mdi:download-network
              - name: Upload
                entity: sensor.fritzbox_upload_speed
                icon: mdi:upload-network
              - name: Empfangen
                entity: sensor.fritzbox_received
                icon: mdi:download
              - name: Gesendet
                entity: sensor.fritzbox_sent
                icon: mdi:upload
              - name: Firmware
                entity: sensor.fritzbox_firmware
                icon: mdi:router-wireless-settings
                span: 2
              - name: Paperless Eingang
                entity: sensor.paperless_inbox
                icon: mdi:inbox-arrow-down
                span: 2
              - name: Paperless Dokumente
                entity: sensor.paperless_documents
                icon: mdi:file-document
                span: 2
              - name: Jellyseerr
                entity: binary_sensor.jellyseer_192_168_178_22_5055
                icon: phu:jellyseerr
                tap_action:
                  action: url
                  url_path: http://192.168.178.22:5055
              - name: Immich Fotos
                entity: sensor.immich_photos
                icon: mdi:camera
              - name: Immich Videos
                entity: sensor.immich_videos
                icon: mdi:video
              - name: Immich Speicher
                entity: sensor.immich_storage
                icon: mdi:harddisk
                span: 2
              - name: Jellyfin Filme
                entity: sensor.jellyfin_movies
                icon: mdi:movie-open-play
              - name: Jellyfin Serien
                entity: sensor.jellyfin_series
                icon: mdi:television-classic
              - name: Jellyfin Episoden
                entity: sensor.jellyfin_episodes
                icon: mdi:play-box-multiple
                span: 2
              - name: SABnzbd Geschwindigkeit
                entity: sensor.sabnzbd_speed
                icon: mdi:download-network
              - name: SABnzbd Abgeschlossen
                entity: sensor.sabnzbd_completed
                icon: mdi:download-box
              - name: SABnzbd Queue
                entity: sensor.sabnzbd_queue
                icon: mdi:download-multiple
                span: 2
              - name: Prowlarr
                entity: sensor.prowlarr_status
                icon: mdi:account-key
              - name: Radarr
                entity: sensor.radarr_status
                icon: mdi:filmstrip
              - name: Sonarr
                entity: sensor.sonarr_status
                icon: mdi:television-classic
              - name: qBittorrent
                entity: sensor.qbittorrent_status
                icon: mdi:alpha-q-box
              - name: Datenträgerbelegung
                entity: sensor.synology_rs1221_storage
                icon: mdi:chart-areaspline
                span: 4
